<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F2" />
    <!-- %BRAND_NAME%, %SITE_DESCRIPTION% and %SITE_URL% are filled from .env at build time (see vite.config.ts). -->
    <title>%BRAND_NAME% — شموع ورد وباقات مصنوعة يدوياً</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME% — شموع ورد وباقات مصنوعة يدوياً" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="ar_AR" />
    <!-- public/og.jpg is generated by `node scripts/og-image.mjs` (see README); regenerate after changing the brand name or tagline. -->
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%BRAND_NAME% — شموع ورد وباقات مصنوعة يدوياً" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_NAME% — شموع ورد وباقات مصنوعة يدوياً" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:image:alt" content="%BRAND_NAME% — شموع ورد وباقات مصنوعة يدوياً" />
    <!-- Self-hosted IBM Plex Sans Arabic (see src/styles/index.css); preload the weight the first paint uses. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
